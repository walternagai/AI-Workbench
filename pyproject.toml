[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["benchmarks"]
omit = ["*/__pycache__/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
