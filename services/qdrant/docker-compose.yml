# services/qdrant/docker-compose.yml
# Vector store used by the RAG stack.
services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: awb-qdrant
    restart: unless-stopped
    ports:
      - "${SERVICES_BIND_HOST:-127.0.0.1}:${QDRANT_HTTP_PORT:-6333}:6333"
      - "${SERVICES_BIND_HOST:-127.0.0.1}:${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
