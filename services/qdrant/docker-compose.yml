# services/qdrant/docker-compose.yml
# Vector store used by the RAG stack.
services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: awb-qdrant
    restart: unless-stopped
    # Bind no gateway docker (172.17.0.1) — alcançável por containers do hub
    # (ex.: proxy /shiori/api/qdrant do seiryu) sem expor na LAN física.
    # NOTA: não usa SERVICES_BIND_HOST (config.env global fixa 127.0.0.1,
    # que inutilizaria o Qdrant para os containers); chromadb/postgres
    # permanecem no bind local por segurança.
    ports:
      - "172.17.0.1:${QDRANT_HTTP_PORT:-6333}:6333"
      - "172.17.0.1:${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
