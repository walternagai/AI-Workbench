# services/openwebui/docker-compose.yml
# Student-facing single entry point sitting in front of Ollama/llama.cpp.
services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: awb-open-webui
    restart: unless-stopped
    ports:
      - "${OPENWEBUI_PORT:-3000}:8080"
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:?set a secret key in config.env}
    volumes:
      - openwebui_data:/app/backend/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  openwebui_data:
