# services/postgres/docker-compose.yml
# Backing store for services that need relational persistence
# (e.g. Kaname AI Gateway quotas/usage, when deployed alongside).
services:
  postgres:
    image: postgres:16-alpine
    container_name: awb-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-awb}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set a password in config.env}
      - POSTGRES_DB=${POSTGRES_DB:-awb}
    ports:
      - "${SERVICES_BIND_HOST:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
