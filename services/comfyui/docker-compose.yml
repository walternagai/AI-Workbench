# services/comfyui/docker-compose.yml
# ComfyUI — geração de imagens local (backend headless do Kage, no Seiryu).
# GPU: COMFYUI_GPU_UUID (config.local.env). Sem ela o compose não sobe, e
# services/install.sh checa antes para dar uma mensagem clara.
# Publicado só no gateway docker0 (172.17.0.1). O Seiryu alcança via
# host.docker.internal:7860, que o host-gateway resolve para esse IP. Não é
# acessível pela LAN: o Docker publica direto no iptables, então o bind é o que
# protege, não o UFW. Auth desligada: o acesso de fora passa pelo auth_request
# do nginx do hub. Containers locais ainda alcançam a porta (risco residual).
services:
  comfyui:
    # Imagem construída em camadas: base 0.42.1 (torch 2.7.1+cu128) com as
    # camadas de restauração (DDColor/Real-ESRGAN/GFPGAN/LaMa) e, por cima, o
    # código do ComfyUI 0.43.2 — os pesos e custom nodes são preservados.
    # Reconstruir com:
    #   docker build --target comfyui-0.43 -t seiryu/comfyui:0.43.2-cu128-restore services/comfyui/
    # Rollback: apontar para seiryu/comfyui:0.42.1-cu128-restore e recriar.
    image: ${COMFYUI_IMAGE:-seiryu/comfyui:0.43.2-cu128-restore}
    container_name: awb-comfyui
    restart: unless-stopped
    ports:
      - "172.17.0.1:${COMFYUI_PORT:-7860}:7860"
    environment:
      - NVIDIA_VISIBLE_DEVICES=${COMFYUI_GPU_UUID:?defina COMFYUI_GPU_UUID em config.local.env}
      - COMFYUI_PORT=7860
      # Dentro do container precisa escutar em 0.0.0.0 para o port mapping
      # funcionar. A restrição de rede é o bind de ports acima.
      - CLI_ARGS=--listen 0.0.0.0
      # Auth desabilitada: o acesso é via hub do seiryu (auth_request do
      # nginx), que já exige sessão válida antes de chegar ao proxy.
      - WEB_ENABLE_AUTH=false
    volumes:
      - comfyui_data:/workspace
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids:
                - ${COMFYUI_GPU_UUID:?defina COMFYUI_GPU_UUID em config.local.env}
              capabilities: [gpu]

volumes:
  comfyui_data:
