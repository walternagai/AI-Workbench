# services/chromadb/docker-compose.yml
# Alternative embedded/local vector store for lighter RAG workflows.
services:
  chromadb:
    image: chromadb/chroma:latest
    container_name: awb-chromadb
    restart: unless-stopped
    ports:
      - "${CHROMADB_PORT:-8000}:8000"
    volumes:
      - chromadb_data:/chroma/chroma

volumes:
  chromadb_data:
