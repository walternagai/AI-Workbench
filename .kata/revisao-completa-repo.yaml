findings:
  - id: A1
    severidade: alta
    tipo: seguranca
    arquivos: "services/comfyui/docker-compose.yml:20,24,27 ; config.env:67-70"
    achado: "ComfyUI publicado em 0.0.0.0 (todas as interfaces, inclusive LAN), com --listen 0.0.0.0 e WEB_ENABLE_AUTH=false. O config.env diz que a porta fica em localhost. Docker publica portas direto no iptables, então o UFW não bloqueia."
    evidencia: "Leitura do compose e do config.env. Não testado na rede. A auth é delegada ao auth_request do nginx do hub, que não protege acesso direto à porta."
    correcao: "Publicar em 172.17.0.1 (como o qdrant) ou em 127.0.0.1 com host-gateway, e corrigir o comentário do config.env. Se a auth continuar desligada, deixar isso explícito no README como exposição aceita."
    status: aberto (decisão de design do autor; registrado na rodada anterior)
  - id: A2
    severidade: alta
    tipo: reprodutibilidade
    arquivos: "config.env:41-43,54,63 ; services/install.sh:23-26,35-44 ; services/chromadb/docker-compose.yml:23-24 ; services/comfyui/docker-compose.yml:16,22,38 ; README.md:35"
    achado: "A instalação padrão não conclui em outra máquina. INSTALL_CHROMADB, INSTALL_POSTGRES e INSTALL_COMFYUI vêm true. ChromaDB exige a rede externa seiryu_seiryu-network, que só existe no hub do autor. ComfyUI usa o UUID fixo de uma RTX 5060 Ti e a imagem local seiryu/comfyui:0.43.2-cu128-restore, que não vem de nenhum registry. OpenWebUI e Postgres abortam com o placeholder change-me sem config.local.env. O README manda copiar para config.env.local, mas o loader lê config.local.env. Resultado: a instalação falha com FATAL em section_services, depois de baixar os modelos."
    evidencia: "Leitura do config.env, do compose e do services/install.sh. docker network ls nesta máquina não lista seiryu_seiryu-network. Não executei install.sh, porque ele alteraria o sistema."
    correcao: "Trocar o default de INSTALL_CHROMADB e INSTALL_COMFYUI para false, ou tornar a rede externa e o UUID configuráveis por variável. Corrigir o cp do README para config.local.env.example. Fazer o install avisar antes de começar se faltarem segredos."
    status: aberto
  - id: M1
    severidade: media
    tipo: teste-nao-hermetico
    arquivos: "tests/bats/detect_accel.bats:58,74,97,111"
    achado: "4 falhas em make test-bats. O teste remove o stub vulkaninfo/clinfo com rm -f, mas o binário real está em /usr/bin e responde no host (Intel Arc MTL). O estado vira functional, não icd-only/none. O CLAUDE.md proíbe testes que dependem do host."
    evidencia: "Reproduzido. Cópia do teste sem as 4 linhas rm -f: 6/6 ok, com o stub vazio mantido."
    correcao: "Remover as 4 linhas rm -f. O stub que imprime saída vazia já simula 'ferramenta sem resultado'."
    status: aberto
  - id: M2
    severidade: media
    tipo: bug-shell
    arquivos: "doctor.sh:8,28 ; detect.sh:9"
    achado: "doctor.sh é deliberadamente sem -e, mas faz source de detect.sh, que tem set -euo pipefail no topo. O shell do doctor passa a ter -e. Qualquer atribuição com comando que falha aborta o doctor sem gerar os reports."
    evidencia: "Reproduzido: após source detect.sh, $- passa de huBc para ehuBc. out=$(false | head -1) aborta com exit 1 e não imprime o fim."
    correcao: "Em detect.sh, aplicar set -euo pipefail só quando executado diretamente. Ou o doctor.sh reaplica set -uo pipefail depois do source."
    status: aberto
  - id: M3
    severidade: media
    tipo: validacao-quebrada
    arquivos: "scripts/awb:102-103 ; install.sh:382"
    achado: "A validação de awb runtime aceita '.' e '..' (regex ^[a-zA-Z0-9._-]+$). Com '..', o caminho vira runtimes/../install.sh, que é o install.sh da raiz. O safe_source o carrega, e o main() no fim do arquivo roda o instalador inteiro. A validação existe justamente para impedir path traversal."
    evidencia: "Resolução do caminho confirmada: runtimes/../install.sh existe. A execução completa não foi feita, para não rodar o instalador."
    correcao: "Rejeitar '.' e '..' (exigir primeiro caractere alfanumérico) e checar [[ -d runtimes/$rt ]] antes do source."
    status: aberto
  - id: M4
    severidade: media
    tipo: falso-negativo-sigpipe
    arquivos: "platforms/nvidia/cudnn.sh:17,21,38 ; platforms/intel/oneapi.sh:15 ; baixo risco: platforms/intel/opencl.sh:16 ; platforms/nvidia/opencl.sh:13"
    achado: "grep -q dentro de pipeline com pipefail: o grep sai no primeiro match, o produtor recebe SIGPIPE e o pipeline dá falso. Na guarda de idempotência do cuDNN, isso faz o script pular o skip e tentar instalar o pacote conflitante que o próprio comentário (cudnn.sh:32-35) diz quebrar o apt."
    evidencia: "Reproduzido: seq 1 2000000 | grep -q '^1$' com pipefail dá NOMATCH em 5 de 5 execuções, mesmo com o padrão presente."
    correcao: "Trocar grep -q por grep >/dev/null (lê toda a entrada, sem SIGPIPE), ou usar dpkg -s para o pacote."
    status: aberto
  - id: M5
    severidade: media
    tipo: bug-shell
    arquivos: "monitoring/temperature.sh:10 ; monitoring/gpu.sh:11-12 ; scripts/awb:20,72-78"
    achado: "awb monitor aborta silenciosamente. Com pipefail + set -e, sensors | grep -E '°C' sem nenhuma linha em °C faz o script sair com 1 e sem mensagem. O mesmo vale para nvidia-smi | sed quando o driver não responde."
    evidencia: "Reproduzido: sensors sem linha em °C dá exit=1 e nenhum texto depois do cabeçalho Temperature."
    correcao: "Tratar o pipeline: '|| true' ou um if, com a mensagem de fallback que já existe para ausência de sensors."
    status: aberto
  - id: M6
    severidade: media
    tipo: falso-aviso-doctor
    arquivos: "doctor.sh:263-266 ; runtimes/onnxruntime/install.sh:7-13"
    achado: "O doctor exige o pacote onnxruntime-openvino sempre. O runtime instala onnxruntime-gpu em NVIDIA e onnxruntime em CPU/AMD. Com INSTALL_ONNXRUNTIME=true, esses hosts recebem aviso falso de 'não instalado'."
    evidencia: "Leitura direta dos dois arquivos."
    correcao: "Usar uma fonte única para o nome do pacote (mover _onnxruntime_package para lib/ e chamar nos dois lugares)."
    status: aberto
  - id: M7
    severidade: media
    tipo: compatibilidade
    arquivos: "install.sh:167-170,184 ; platforms/intel/npu.sh:71 ; platforms/nvidia/repo.sh:23"
    achado: "Linux Mint é declarado suportado, mas: (a) o repositório do Docker usa VERSION_CODENAME, que no Mint é o codinome do Mint e não do Ubuntu. O apt então falha e cai no fail_loud da linha 184. (b) As tags de asset usam VERSION_ID (ubuntu${OS_VERSION//./}), que no Mint gera 'ubuntu22' em vez de 'ubuntu2404'."
    evidencia: "Leitura do código. Não testado em Mint. Os nomes dos campos do os-release do Mint (UBUNTU_CODENAME) são de memória e precisam ser confirmados."
    correcao: "Usar UBUNTU_CODENAME quando existir e mapear a versão Ubuntu base para as tags. Testar em Mint real."
    status: aberto
  - id: B1
    severidade: baixa
    tipo: codigo-morto
    arquivos: "runtimes/llama.cpp/install.sh:28"
    achado: "require_cmd ninja ... || true. require_cmd chama fail_loud, que faz exit. O '|| true' nunca é alcançado, e o comentário 'opcional' é falso. Na prática, install.sh:127-129 já instala ninja-build."
    evidencia: "Reproduzido: require_cmd __inexistente__ || true encerra o script com exit 1."
    correcao: "Remover o '|| true' e ajustar o comentário, ou usar has_cmd para o caso opcional."
    status: aberto
  - id: B2
    severidade: baixa
    tipo: bug-python
    arquivos: "benchmarks/embeddings/bench_embeddings.py:33,56"
    achado: "--iterations 0 gera ZeroDivisionError em format_report, porque a média de uma lista vazia é 0.0."
    evidencia: "Reproduzido com stub de sentence_transformers: ZeroDivisionError float division by zero."
    correcao: "Validar iterations >= 1 em parse_args (argparse com erro claro)."
    status: aberto
  - id: B3
