decisao:
  necessaria: true
  opcoes:
  - 'Publicar em 172.17.0.1, como o qdrant, sem mudar a auth. RECOMENDADA: o host-gateway do hub alcança esse IP e a documentação passa a bater com o comportamento.'
  - 'Publicar em 127.0.0.1. NÃO funciona para o hub: host.docker.internal resolve para 172.17.0.1, não para o loopback.'
  - Manter 0.0.0.0 e ligar WEB_ENABLE_AUTH. Exige credencial no fluxo do hub; muda o comportamento.
  status: decidido
  analise:
    evidencias:
    - 172.17.0.1 é o gateway do docker0 (ip -4 addr show docker0). Dentro de container, host-gateway resolve para 172.17.0.1 (getent em alpine:3).
    - 'Teste real: servidor ligado em 172.17.0.1:17861 é alcançável por container via http://host.docker.internal:17861. Servidor ligado em 127.0.0.1:17860 NÃO é alcançável pelo mesmo caminho.'
    - O hub chama o ComfyUI por http://host.docker.internal:7860 (ninja-apps/seiryu docker-compose.yml:137, KAGE_COMFYUI_ORIGIN; nginx.conf:456-480). Qualquer bind diferente de 172.17.0.1 ou 0.0.0.0 quebra
      o hub.
    - 0.0.0.0 publica para a LAN. Docker escreve regras no iptables e contorna o UFW (comportamento conhecido do Docker; não reproduzido nesta máquina).
    alternativas:
    - id: O1
      descricao: Publicar em 172.17.0.1, como o qdrant.
      resolve: Exposição à LAN. O hub continua funcionando (testado).
      nao_resolve: Qualquer container no host alcança o ComfyUI sem auth, porque host-gateway aponta para o mesmo IP em todas as redes default.
      custo: 'baixo: uma linha e o comentário'
      reversivel: true
      status: recomendada agora
    - id: O2
      descricao: Publicar em 127.0.0.1.
      resolve: Exposição à LAN.
      nao_resolve: 'Quebra o hub: testado, o container não alcança o loopback do host.'
      custo: '-'
      reversivel: true
      status: rejeitada (testada)
    - id: O3
      descricao: Manter 0.0.0.0 e ligar auth no ComfyUI.
      resolve: Exige credencial mesmo em acesso direto.
      nao_resolve: 'Não verificado se a imagem local suporta auth nativa: WEB_ENABLE_AUTH não tem documentação no repositório. Enquanto isso, a LAN continua exposta.'
      custo: 'médio: muda o fluxo do hub'
      reversivel: true
      status: adiada até verificar a imagem
    - id: O4
      descricao: ComfyUI na rede seiryu-network, sem porta publicada no host. O hub resolve awb-comfyui por DNS, como já faz com awb-chromadb.
      resolve: 'Isolamento mais forte: só containers do hub alcançam o serviço.'
      nao_resolve: Nada imediatamente. Exige mudar nginx e compose nos dois repositórios.
      custo: 'alto: coordenação entre repositórios'
      reversivel: true
      status: evolução futura
    recomendacao: O1 agora, com o risco residual declarado (containers locais sem auth). Abrir O4 como evolução no repositório do hub.
    pergunta: Aceita O1 com esse risco residual? Quer O4 registrado como follow-up?
  resposta: 'O1 aceita: publicar em 172.17.0.1, com o risco residual de containers locais sem auth. O4 registrado como follow-up no repositório do hub.'
