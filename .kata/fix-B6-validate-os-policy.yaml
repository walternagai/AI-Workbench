decisao:
  necessaria: true
  opcoes:
  - 'RECOMENDADA: aceitar só Ubuntu, Pop!_OS e Linux Mint, porque os repositórios de Docker, ROCm e NVIDIA assumem Ubuntu. README ajustado.'
  - 'Aceitar derivados Debian: ajustar a mensagem, o comentário e manter o README.'
  status: decidido
  analise:
    evidencias:
    - validate_os aceita ID=debian e qualquer ID_LIKE com debian (lib/validation.sh:25).
    - 'O repositório Docker Ubuntu não tem bookworm: https://download.docker.com/linux/ubuntu/dists/bookworm/Release retorna 404. O repositório Debian retorna 200. install_docker_ce sempre usa o caminho
      ubuntu (install.sh:180 e 185). Logo, Debian passa na validação e falha depois, no Docker.'
    - NVIDIA tem repositório debian12 (200) e ubuntu2404 (200). repo.sh:23 monta só ubuntu${VERSION_ID}.
    - Linux Mint (ID=linuxmint, ID_LIKE com ubuntu) passa na validação e cai no problema de codinome do M7 de qualquer forma.
    - 'README.md:24 diz ''Ubuntu 22.04 ou superior (ou Debian-based)''. A mensagem de erro em validation.sh:31 diz ''Supported: Ubuntu, Pop!_OS, Linux Mint''.'
    alternativas:
    - id: O1
      descricao: Restringir a Ubuntu, Pop!_OS e Linux Mint. README alinhado.
      resolve: Falha cedo, com mensagem honesta, em vez de falhar no meio da instalação. Elimina a contradição.
      nao_resolve: Exclui quem roda Debian puro. Hoje Debian já quebra no Docker, então a perda real é pequena.
      custo: 'baixo: uma lista e o README'
      reversivel: true
      status: recomendada
    - id: O2
      descricao: Suportar Debian.
      resolve: Amplia o público.
      nao_resolve: 'Exige mapear distro em pelo menos 4 pontos: Docker (caminho por distro), NVIDIA (debian12 em vez de ubuntuXXYY), ROCm (repo.radeon por codinome, não verificado para Debian) e NPU (só
        assets ubuntu, então ficaria pulado). Sem máquina Debian para testar.'
      custo: médio a alto
      reversivel: true
      status: só se houver demanda real
    - id: O3
      descricao: Manter a aceitação ampla e corrigir só a mensagem.
      resolve: A mensagem.
      nao_resolve: 'O comportamento: Debian continua passando na validação e falhando no Docker.'
      custo: baixo
      reversivel: true
      status: rejeitada
    recomendacao: O1. Tratar Debian como item de roadmap, se houver demanda.
    pergunta: Confirma O1 (Ubuntu, Pop!_OS e Linux Mint)? Ou prefere O2 mesmo sem máquina Debian para testar?
  resposta: 'O1: restringir a Ubuntu, Pop!_OS e Linux Mint, com README alinhado.'
