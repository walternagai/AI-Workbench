    a seção.'
  - Manter os defaults e documentar os pré-requisitos (rede seiryu, imagem seiryu/comfyui, UUID da GPU) no README.
  - Tornar UUID da GPU e nome da rede externa variáveis, com default vazio, e tornar a rede externa opcional por um arquivo de override.
  status: decidido
  analise:
    evidencias:
    - 'O hub depende do ChromaDB: nginx.conf:51 (upstream awb-chromadb) e nginx.conf:373 (/shiori/api/chroma/). O compose do hub documenta a conexão manual à seiryu_seiryu-network (docker-compose.yml:547-548).'
    - 'O hub depende do ComfyUI no host: docker-compose.yml:137 e nginx.conf:456-480. O hub não tem serviço comfyui próprio.'
    - seiryu_seiryu-network só existe com a stack do hub no ar. Nesta máquina, docker network ls não a lista.
    - A imagem seiryu/comfyui:0.43.2-cu128-restore não está nesta máquina e não vem de registry (docker image ls).
    - CLAUDE.md do repositório diz que config.env é público e que overrides e segredos vão em config.local.env.
    alternativas:
    - id: O1
      descricao: Mover os valores pessoais para config.local.env. config.env público passa a ter INSTALL_CHROMADB=false e INSTALL_COMFYUI=false. UUID da GPU e nome da rede viram variáveis (COMFYUI_GPU_UUID,
        CHROMADB_EXTERNAL_NETWORK) lidas de config.local.env.
      resolve: Instalação concluível fora da máquina do autor. Segue a regra que o próprio repositório já define.
      nao_resolve: Sem o hub, ChromaDB e ComfyUI ficam desligados. Isso é o esperado.
      custo: 'médio: compose parametrizado e services/install.sh'
      reversivel: true
      status: recomendada
    - id: O2
      descricao: Manter os defaults e documentar os pré-requisitos no README.
      resolve: Nada no código.
      nao_resolve: A instalação padrão continua abortando (services/install.sh:35-44 e compose).
      custo: baixo
      reversivel: true
      status: rejeitada
    - id: O3
      descricao: Preflight em services/install.sh que pula o serviço com aviso, mantendo os defaults em true.
      resolve: Aborto em máquina sem o pré-requisito. O autor não muda nada.
      nao_resolve: A instalação padrão ainda tenta subir serviços. PRINCIPLES.md §1 (fail-loud) aceita exceção, desde que documentada no ponto de chamada.
      custo: baixo a médio
      reversivel: true
      status: rede de segurança, combinável com O1
    - id: O4
      descricao: Gerar WEBUI_SECRET_KEY e POSTGRES_PASSWORD no primeiro install, em config.local.env com modo 600.
      resolve: Aborto por placeholder change-me, sem intervenção manual.
      nao_resolve: Não resolve rede externa nem UUID da GPU.
      custo: baixo; o instalador passa a escrever segredos em disco
      reversivel: true
      status: opcional, decisão de política
    recomendacao: O1 mais O3 como rede de segurança. O4 só se você quiser que o instalador gere segredos.
    pergunta: Confirma O1 (valores pessoais em config.local.env, defaults de serviços em false)? Quer O3 como rede de segurança? Quer O4?
  resposta: O1 mais O3. Valores pessoais em config.local.env; defaults de serviços em false; preflight que pula com aviso para dependência externa ausente. O4 (gerar segredos) não adotado.
