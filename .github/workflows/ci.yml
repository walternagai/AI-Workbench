name: CI

on:
  push:
  pull_request:

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Ensure ShellCheck is available
        run: command -v shellcheck || { sudo apt-get update && sudo apt-get install -y shellcheck; }

      # Run through the Makefile rather than duplicating the command here: the
      # file list and severity live in one place, and CI fails if the target a
      # contributor runs locally stops matching what CI checks. See the
      # Makefile for why --severity=warning is the threshold.
      - name: Lint all shell scripts
        run: make test-shell

  python-tests:
    name: pytest (benchmarks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Run tests with coverage
        run: make test-python

  bats:
    name: bats (lib/ unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Ensure bats is available
        run: command -v bats || { sudo apt-get update && sudo apt-get install -y bats; }

      - name: Run bats tests
        run: make test-bats
